[build]
  base = "frontend"
  command = "npm ci && npm run build"
  publish = "dist"

# Serverless functions (AI chat) – must be deployed for /.netlify/functions/ai-chat to work
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
