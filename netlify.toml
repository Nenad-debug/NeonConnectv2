[build]
  base = "frontend"
  command = "npm ci && npm run build"
  publish = "dist"

# Serverless functions (AI chat) – path relative to base; use frontend/netlify/functions
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
